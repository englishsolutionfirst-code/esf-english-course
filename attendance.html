<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Attendance | ESF English Course</title>

    <style>
        :root {
            --navy: #071a33;
            --blue: #173b63;
            --gold: #c9a227;
            --light: #f5f7fa;
            --white: #ffffff;
            --text: #1f2937;
            --border: #d9dee7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--light);
            color: var(--text);
        }

        .header {
            background: var(--navy);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .header p {
            margin: 0;
            opacity: 0.9;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .attendance-card {
            background: var(--white);
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .section-title {
            margin-top: 0;
            margin-bottom: 28px;
            color: var(--navy);
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--navy);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--gold);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 15px;
            background: var(--navy);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--blue);
        }

        .footer {
            background: var(--navy);
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .attendance-card {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>ESF English Course</h1>
    <p>Student Attendance</p>
</header>

<main class="container">

    <div class="attendance-card">

        <h2 class="section-title">Student Attendance Form</h2>

        <form>

            <div class="form-group">
                <label for="studentName">Student Name</label>
                <input
                    type="text"
                    id="studentName"
                    name="studentName"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="form-group">
                <label for="program">Program</label>
                <select id="program" name="program" required>
                    <option value="">Select your program</option>
                    <option value="IELTS Preparation">IELTS Preparation</option>
                    <option value="TOEFL Preparation">TOEFL Preparation</option>
                    <option value="TOEIC Preparation">TOEIC Preparation</option>
                    <option value="PTE Preparation">PTE Preparation</option>
                    <option value="Business English">Business English</option>
                    <option value="General English">General English</option>
                    <option value="English for Kids">English for Kids</option>
                </select>
            </div>

            <div class="form-group">
                <label for="classType">Class Type</label>
                <select id="classType" name="classType" required>
                    <option value="">Select class type</option>
                    <option value="Private">Private</option>
                    <option value="Small Group">Small Group</option>
                    <option value="Online">Online</option>
                </select>
            </div>

            <div class="form-group">
                <label for="attendanceStatus">Attendance Status</label>
                <select id="attendanceStatus" name="attendanceStatus" required>
                    <option value="">Select attendance status</option>
                    <option value="Present">Present</option>
                    <option value="Late">Late</option>
                    <option value="Absent">Absent</option>
                </select>
            </div>

            <div class="form-group">
                <label for="remarks">Remarks</label>
                <textarea
                    id="remarks"
                    name="remarks"
                    placeholder="Optional remarks"></textarea>
            </div>

            <button type="submit" class="submit-btn">
                Submit Attendance
            </button>

        </form>

    </div>

</main>

<footer class="footer">
    © 2026 ESF English Course — Learn English, Achieve More.
</footer>

</body>
</html>
